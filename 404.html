<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>正在載入產品護照...</title>
    <script>
        (function() {
            const path = window.location.pathname;  // 例如 /WaterDPP/01/04712345678901/21/A00001

            // 將路徑分割成陣列，過濾空字串
            const segments = path.split('/').filter(s => s.length > 0);

            let gtin = null;
            let serial = null;
            let basePath = '/';

            // 找出 01 與 21 的位置
            let idx01 = segments.indexOf('01');
            if (idx01 !== -1 && idx01 + 1 < segments.length) {
                gtin = segments[idx01 + 1];
                // 從 01 之後找 21
                let idx21 = segments.indexOf('21', idx01 + 2);
                if (idx21 !== -1 && idx21 + 1 < segments.length) {
                    serial = segments[idx21 + 1];
                }
            }

            // 計算基礎路徑（從開頭到 01 之前的部分）
            if (idx01 > 0) {
                // 例如 segments = ["WaterDPP", "01", ...]，則基礎路徑為 "/WaterDPP/"
                basePath = '/' + segments.slice(0, idx01).join('/') + '/';
            } else {
                // 若沒有子目錄，就是根目錄
                basePath = '/';
            }

            // 構建目標網址
            let targetUrl = window.location.origin + basePath + 'index.html';
            if (gtin && serial) {
                targetUrl += '?gtin=' + encodeURIComponent(gtin) + '&serial=' + encodeURIComponent(serial);
            }

            // 執行跳轉
            window.location.replace(targetUrl);
        })();
    </script>
</head>
<body>
    <p>正在載入產品護照，請稍候...</p>
</body>
</html>
